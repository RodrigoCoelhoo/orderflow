server.port=8084
spring.application.name=inventory-service

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://postgres-master:5432/orderflow_inventory
spring.datasource.username=orderflow
spring.datasource.password=orderflow
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- RabbitMQ ---
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# --- RabbitMQ Queue Names ---
rabbitmq.queues.order-created=order.created
rabbitmq.queues.inventory-result=inventory.result
rabbitmq.queues.order-cancelled=order.cancelled

# --- Logging ---
logging.level.com.orderflow=DEBUG
logging.level.org.springframework.amqp=INFO
