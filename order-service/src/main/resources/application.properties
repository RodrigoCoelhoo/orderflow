server.port=8081
spring.application.name=order-service

# --- PostgreSQL Master (escritas) ---
spring.datasource.master.url=jdbc:postgresql://postgres-master:5432/orderflow
spring.datasource.master.username=orderflow
spring.datasource.master.password=orderflow
spring.datasource.master.driver-class-name=org.postgresql.Driver

# --- PostgreSQL Slave (leituras via GraphQL) ---
spring.datasource.slave.url=jdbc:postgresql://postgres-slave:5432/orderflow
spring.datasource.slave.username=orderflow
spring.datasource.slave.password=orderflow
spring.datasource.slave.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- RabbitMQ ---
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# --- Redis ---
spring.data.redis.host=redis
spring.data.redis.port=6379

# --- GraphQL ---
spring.graphql.graphiql.enabled=true
spring.graphql.path=/graphql

# --- JWT ---
jwt.secret=${JWT_SECRET:changeme-local-secret-deve-ter-pelo-menos-32-chars}
jwt.expiration-ms=86400000

# --- Idempotency ---
idempotency.ttl-hours=24

# --- RabbitMQ Queue Names ---
rabbitmq.queues.order-created=order.created
rabbitmq.queues.payment-result=payment.result
rabbitmq.queues.inventory-result=inventory.result
rabbitmq.queues.order-cancelled=order.cancelled

# --- Logging ---
logging.level.com.orderflow=DEBUG
logging.level.org.springframework.amqp=INFO
