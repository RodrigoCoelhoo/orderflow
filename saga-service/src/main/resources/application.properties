server.port=8085
spring.application.name=saga-service

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://postgres-master:5432/orderflow_saga
spring.datasource.username=orderflow
spring.datasource.password=orderflow
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- RabbitMQ ---
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# --- Saga ---
saga.timeout-minutes=15

# --- RabbitMQ Queue Names ---
rabbitmq.queues.payment-result=payment.result
rabbitmq.queues.inventory-result=inventory.result
rabbitmq.queues.order-cancelled=order.cancelled

# --- Logging ---
logging.level.com.orderflow=DEBUG
logging.level.org.springframework.amqp=INFO
logging.level.org.springframework.web.socket=INFO
