events {
    worker_connections 1024;
}

http {

    # ─── Upstream: order-service com load balancing (round-robin) ─────────────
    upstream order_service {
        server order-service-1:8081;
        server order-service-2:8081;
    }

    # ─── Upstream: restantes serviços (uma instância cada) ────────────────────
    upstream payment_service {
        server payment-service:8083;
    }

    upstream saga_service {
        server saga-service:8085;
    }

    server {
        listen 80;

        # ─── order-service: auth, produtos, pedidos, graphql ──────────────────
        location /api/auth/ {
            proxy_pass http://order_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/products/ {
            proxy_pass http://order_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/orders/ {
            proxy_pass http://order_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /graphql {
            proxy_pass http://order_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /graphiql {
            proxy_pass http://order_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ─── payment-service: webhook do Stripe ───────────────────────────────
        location /api/stripe/ {
            proxy_pass http://payment_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ─── saga-service: WebSocket ───────────────────────────────────────────
        location /ws/ {
            proxy_pass http://saga_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ─── Frontend (quando for adicionado) ─────────────────────────────────
        location / {
            proxy_pass http://order_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
