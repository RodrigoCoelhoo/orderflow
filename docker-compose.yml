services:

  # ─── Infraestrutura ───────────────────────────────────────────────────────────

  postgres-master:
    image: postgres:16
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
      POSTGRES_DB: orderflow
    volumes:
      - postgres-master-data:/var/lib/postgresql/data
      - ./infra/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
      - ./infra/postgres/master/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "5432:5432"
    networks:
      - orderflow-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-slave:
    image: postgres:16
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
      PGPASSWORD: replicator
    volumes:
      - postgres-slave-data:/var/lib/postgresql/data
      - ./infra/postgres/slave/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/postgres/slave/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    depends_on:
      postgres-master:
        condition: service_healthy
    ports:
      - "5433:5432"
    networks:
      - orderflow-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI em http://localhost:15672 (guest/guest)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - orderflow-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - orderflow-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Serviços ─────────────────────────────────────────────────────────────────

  order-service:
    build: ./order-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-changeme-local-secret-deve-ter-pelo-menos-32-chars}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    volumes:
      - ./order-service:/app      
      - maven-cache:/root/.m2   
    depends_on:
      postgres-master:
        condition: service_healthy
      postgres-slave:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - orderflow-net

  payment-service:
    build: ./payment-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    volumes:
      - ./payment-service:/app
      - maven-cache:/root/.m2
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - orderflow-net

  inventory-service:
    build: ./inventory-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    volumes:
      - ./inventory-service:/app
      - maven-cache:/root/.m2
    depends_on:
      postgres-master:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - orderflow-net

  saga-service:
    build: ./saga-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - ./saga-service:/app
      - maven-cache:/root/.m2
    depends_on:
      postgres-master:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - orderflow-net

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - order-service
      - payment-service
      - inventory-service
      - saga-service
    networks:
      - orderflow-net

# ─── Volumes ──────────────────────────────────────────────────────────────────

volumes:
  postgres-master-data:
  postgres-slave-data:
  rabbitmq-data:
  redis-data:
  maven-cache:

# ─── Networks ─────────────────────────────────────────────────────────────────

networks:
  orderflow-net:
    driver: bridge
